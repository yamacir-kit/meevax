name: Build and Test
on:
  push:
  schedule:
    - cron: 0 0 * * *
jobs:
  Unix-like:
    runs-on: ${{ matrix.system }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        compiler: [ g++, clang++ ]
        configuration: [ Debug, Release ]
        system: [ ubuntu-22.04, ubuntu-24.04, macos-14, macos-15, macos-26 ]
    steps:
      - uses: actions/checkout@v3
      - run: ./script/setup-${{ matrix.system }}.sh --all
      - run: cmake -B build -D CMAKE_BUILD_TYPE=${{ matrix.configuration }} -D CMAKE_CXX_COMPILER="$(./script/latest-of.sh ${{ matrix.compiler }})"
      - run: cmake --build build --target continuous-integration
      - run: cmake -B example/build -S example -D CMAKE_BUILD_TYPE=${{ matrix.configuration }} -D CMAKE_CXX_COMPILER="$(./script/latest-of.sh ${{ matrix.compiler }})"
      - run: cmake --build example/build --target continuous-integration
